spring:
  application:
    name: nexhire-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/nexhire}
    # No default: must come from the environment (local values live in application-dev.yml).
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Small pool sized for Neon / a 512 MB instance; idle connections are released so Neon can scale to zero.
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 120000
      max-lifetime: 240000
      keepalive-time: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Load lazy associations for a whole page in one query instead of one per row (avoids N+1).
        default_batch_fetch_size: 100
  data:
    web:
      pageable:
        # Nobody can ask for huge pages (e.g. ?size=100000).
        max-page-size: 100
  task:
    execution:
      # Bounded pool for @Async work (notifications, emails) so a burst can't fill the heap.
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 1000
  mail:
    # STARTTLS for port 587 providers (Brevo, Resend, SendGrid, Gmail…); short timeouts so a slow SMTP never blocks.
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:}
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:}
    password: ${SPRING_RABBITMQ_PASSWORD:}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:false}
      validate-server-certificate: false
    listener:
      simple:
        # A broker outage must not take the API down (see RabbitMQConfig).
        missing-queues-fatal: false

server:
  port: 8080
  # Trust X-Forwarded-* only from private-network proxies (Render's load balancer): Tomcat reads the client
  # IP from the right of X-Forwarded-For, so a client can't fake it (rate limits), and Proto/Host make
  # generated URLs (e.g. the calendar feed) https.
  forward-headers-strategy: native
  servlet:
    context-path: /api
  tomcat:
    # Fewer request threads than the default 200: memory on a 512 MB instance, and only 8 DB connections behind them.
    threads:
      max: 50

jwt:
  # No default: set JWT_SECRET (32+ random characters). The app refuses to start without it.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Notifications fall back to direct delivery, so the broker isn't critical to being "UP".
    rabbit:
      enabled: false
    # Email is best-effort; an SMTP outage must not mark the API unhealthy.
    mail:
      enabled: false

# Web app URL (for links in emails) and sender address. SMTP itself is configured with the
# standard SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD variables;
# without SPRING_MAIL_HOST, emails are only logged.
app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:NexHire <no-reply@nexhire.local>}

# Built-in interview video rooms (Daily.co). Leave DAILY_API_KEY unset to use pasted meeting links only.
video:
  daily:
    api-key: ${DAILY_API_KEY:}

# First administrator, created on startup only while no admin exists (see AdminBootstrap).
admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000/nexhire-files}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:nexhire-files}
